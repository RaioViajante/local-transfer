[workspace]
members = ["apps/cli", "crates/local-transfer-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
directories = "6.0.0"
libc = "0.2.189"
local-transfer-core = { path = "crates/local-transfer-core" }
mdns-sd = { version = "0.21.1", default-features = false }
tempfile = "3.22.0"
uuid = { version = "1.18.1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
